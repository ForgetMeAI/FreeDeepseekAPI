<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { width: 420px; padding: 16px; background: #1a1a2e; color: #e0e0e0; font-size: 13px; }
    h1 { font-size: 16px; margin-bottom: 4px; color: #4fc3f7; }
    .sub { font-size: 11px; color: #888; margin-bottom: 14px; }
    .status { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
    .status.ok { background: #1b5e2033; border: 1px solid #2e7d32; color: #66bb6a; }
    .status.warn { background: #e6510033; border: 1px solid #e65100; color: #ff9800; }
    .status.err { background: #b71c1c33; border: 1px solid #c62828; color: #ef5350; }
    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-row button { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-primary { background: #1565c0; color: #fff; }
    .btn-primary:hover { background: #1976d2; }
    .btn-success { background: #2e7d32; color: #fff; }
    .btn-success:hover { background: #388e3c; }
    .btn-warn { background: #e65100; color: #fff; }
    .btn-warn:hover { background: #ef6c00; }
    .json-display { background: #0d1117; border: 1px solid #333; border-radius: 4px; padding: 8px; font-size: 10px; font-family: 'Courier New', monospace; color: #7ee787; white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow-y: auto; margin-bottom: 8px; }
    .field label { display: block; font-size: 11px; color: #999; margin-bottom: 4px; }
    .detail { font-size: 10px; color: #666; text-align: center; }
  </style>
</head>
<body>
  <h1>🔑 DeepSeek → FreeDeepseekAPI</h1>
  <div class="sub">Откройте <code>chat.deepseek.com</code> (залогинены) и нажмите кнопку</div>

  <div id="status" class="status warn">⏳ Loading...</div>

  <div class="btn-row">
    <button id="btnAdd" class="btn-primary" style="font-size:13px;padding:11px">➕ Добавить в FreeDeepseekAPI</button>
  </div>
  <div class="btn-row">
    <button id="btnCollect" class="btn-success">🔄 Собрать</button>
    <button id="btnCopy" class="btn-success">📋 Копировать JSON</button>
    <button id="btnSave" class="btn-warn">💾 Скачать файл</button>
  </div>

  <div class="field">
    <label>Export Preview → <code>deepseek-auth.json</code></label>
    <div id="jsonPreview" class="json-display">{ }</div>
  </div>

  <div class="detail" id="detail">Open chat.deepseek.com, then click Collect</div>

  <script src="popup.js"></script>
</body>
</html>
